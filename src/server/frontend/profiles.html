<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkVM Profiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div class="ph-left">
      <h1>SkVM Profiles</h1>
      <nav class="topnav">
        <a href="/">Proposals</a>
        <a href="/runs">Runs</a>
        <a href="/profiles" class="active">Profiles</a>
        <a href="/bench">Bench</a>
      </nav>
    </div>
    <div class="meta" id="gen-date">—</div>
  </header>

  <section class="main">
    <div class="section-head">
      <h2>Model Capability Profiles</h2>
      <div class="count" id="profiles-count">—</div>
    </div>
    <div class="ptable-wrap">
      <table class="ptable">
        <thead>
          <tr>
            <th>harness</th>
            <th>model</th>
            <th class="num">profiled</th>
          </tr>
        </thead>
        <tbody id="entries">
          <tr><td colspan="3"><div class="loading-state">Loading<span class="bar"></span>profiles</div></td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="./profiles.ts"></script>
</body>
</html>
